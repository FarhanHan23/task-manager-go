version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose     # lupa menutup resp.Body
    - errorlint     # perbandingan error yang tidak memakai errors.Is/As
    - gocritic      # kumpulan saran gaya & bug umum
    - rowserrcheck  # lupa memeriksa rows.Err()
    - sqlclosecheck # lupa menutup sql.Rows / sql.Stmt
  settings:
    errcheck:
      # Pola "defer x.Close()" untuk resource read-only sudah lazim diterima.
      exclude-functions:
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (io.Closer).Close

formatters:
  enable:
    - gofmt
    - goimports
